name: PyJS Core CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install PyJS Infrastructure Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install websockets pytest

    - name: Execute Automated Core Infrastructure Tests
      run: |
        PYTHONPATH=. pytest python/tests/
